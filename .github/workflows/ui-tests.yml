name: UI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-tests:
    name: Component
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # data source specs call the real server: a site on these is served on port 8000
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-ui-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-ui-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install Studio
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app studio "$GITHUB_WORKSPACE"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app studio
        env:
          CI: "Yes"

      - name: Start web server
        working-directory: /home/runner/frappe-bench
        run: |
          bench serve --port 8000 &> /tmp/web.log &
          curl --retry 30 --retry-delay 1 --retry-all-errors --silent --output /dev/null -H "X-Frappe-Site-Name: test_site" http://127.0.0.1:8000/api/method/ping

      - name: Install frontend dependencies
        working-directory: /home/runner/frappe-bench/apps/studio/frontend
        run: |
          yarn install --frozen-lockfile
          yarn install-framework-ui

      - name: Run component tests
        working-directory: /home/runner/frappe-bench/apps/studio/frontend
        run: yarn test:cypress

      - name: Web server log
        if: failure()
        run: cat /tmp/web.log
